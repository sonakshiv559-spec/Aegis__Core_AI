# AegisCore Detection Rule: Credential Dump on Endpoint
# Rule ID: AEGY-EDR-001
# Maps to Scenario 1 + 5 (CrowdStrike detections)

id: AEGY-EDR-001
name: LSASS Memory Dump — Credential Harvesting
description: >
  Detects process activity consistent with LSASS memory dumping tools
  (e.g., Mimikatz, ProcDump, Task Manager dump). Strongly correlated with
  credential theft and lateral movement preparation.
severity: HIGH
event_class: EndpointActivity
activity_names:
  - ThreatDetection
  - ProcessSpawn
conditions:
  any:
    - field: actor.extras.technique
      op: contains
      value: "Credential"
    - field: actor.extras.command_line
      op: regex
      pattern: "(procdump|mimikatz|sekurlsa|lsadump|comsvcs|MiniDump)"
    - field: target.resource_name
      op: contains
      value: "lsass.exe"
score_contributions:
  anomaly_score: 0.85
  threat_confidence_base: 0.80
  evidence_predicates:
    - credential_dump_confirmed
    - endpoint_telemetry_present
mitre_attack:
  tactic: Credential Access
  technique: T1003
  sub_technique: "T1003.001"
tags:
  - credential_dumping
  - lsass
  - endpoint
policy_version: v1.0.0
